name: Project Tracking

on:
  workflow_dispatch:
    inputs:
      input_tsv:
        description: "Paste TSV input from dashboard"
        required: false
        type: string
  schedule:
    - cron: "30 0 * * *" # 07:30 Vietnam time

permissions:
  contents: write
  actions: read

jobs:
  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Write dashboard input to TSV
        if: ${{ github.event.inputs.input_tsv != '' }}
        run: |
          mkdir -p data
          cat > data/input.tsv <<'EOF'
          ${{ github.event.inputs.input_tsv }}
          EOF

      - name: Run tracking bot
        run: npm run tracking

      - name: Commit tracking results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/results/ data/input.tsv || true
          git commit -m "Update tracking results" || echo "No changes to commit"
          git push
