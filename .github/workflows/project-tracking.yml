name: Project Tracking

on:
  workflow_dispatch:
    inputs:
      input_base64:
        description: "Base64 encoded TSV input from dashboard. Optional; leave blank to use data/input.tsv."
        required: false
        type: string
      commit_input:
        description: "Commit dashboard input back to data/input.tsv"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_label:
        description: "Optional label shown in workflow run metadata"
        required: false
        type: string
  schedule:
    - cron: "30 0 * * *" # 07:30 Vietnam time

permissions:
  contents: write

env:
  CI: true
  TRACKING_INPUT_PATH: data/input.tsv
  TRACKING_OUTPUT_BASE: data/results/latest
  PYTHONUNBUFFERED: "1"
  SELENIUM_HEADLESS: "1"

jobs:
  run-tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Google Chrome for Selenium carriers
        uses: browser-actions/setup-chrome@v1

      - name: Install Python carrier dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/python-carriers.txt

      - name: Prepare dashboard input
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.input_base64 != '' }}
        env:
          INPUT_BASE64: ${{ github.event.inputs.input_base64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ.get("INPUT_BASE64", "").strip()
          if raw:
              text = base64.b64decode(raw).decode("utf-8-sig")
              Path("data").mkdir(exist_ok=True)
              Path("data/input.tsv").write_text(text, encoding="utf-8")
              print(f"Dashboard input written to data/input.tsv ({len(text)} chars)")
          PY

      - name: Run Project Tracking
        run: npm run tracking:tsv

      - name: Upload tracking result artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-tracking-result
          path: |
            data/results/latest.json
            data/results/latest.tsv
            data/results/latest.csv
          if-no-files-found: error

      - name: Commit latest result back to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/latest.json data/results/latest.tsv data/results/latest.csv || true
          if [ "${{ github.event.inputs.commit_input }}" = "true" ]; then
            git add data/input.tsv
          fi
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update tracking results"
            git push
          fi
